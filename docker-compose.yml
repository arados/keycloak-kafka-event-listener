# ============================================================================
# DEMO / DEVELOPMENT ONLY — DO NOT USE AS-IS IN PRODUCTION.
#
#   - `start-dev` runs Keycloak with the dev profile (HTTP, in-memory H2).
#   - Bootstrap admin credentials are `admin` / `admin`.
#   - The `kafka-demo` realm pre-creates `testuser` / `password`.
#   - Kafka is a single-node KRaft broker with PLAINTEXT listeners and
#     auto topic creation; no auth, no TLS, replication factor 1.
#   - The `secure` profile adds a production-style setup: kafka-secure with a
#     SASL_SSL/SCRAM listener (self-signed certificate and fixed passwords from
#     docker/secure/generate-secrets.sh), Postgres, and a two-node Keycloak cluster
#     (keycloak-secure :8082 / metrics :9002, keycloak-secure-2 :8083 / :9003) started
#     with `start --optimized`, publishing with delivery-mode=outbox and zstd.
#
# Listeners:
#   kafka:9092      — in-network (Keycloak → Kafka)
#   localhost:9094  — from the host (debugging, ad-hoc consumers)
#
# Keycloak: http://localhost:8080 (HTTP), http://localhost:9000/metrics (management interface, Prometheus)
#
# The listener options below exercise routing (e2e/tests/routing.spec.js): LOGOUT goes to its own
# templated topic, USER_INFO_REQUEST user events and REALM_ROLE admin events are filtered out.
# ============================================================================

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates the listener's default topics before Keycloak starts. Auto-creation would work too, but the
  # producer waits at most max.block.ms (1 s) for a new topic's metadata, so the very first event could
  # time out while the broker creates the topic. Topics from custom templates are still auto-created.
  kafka-init:
    image: apache/kafka:4.3.1
    command:
      - sh
      - -c
      - |
        for topic in keycloak.events keycloak.admin-events keycloak.events.kafka-demo.logout; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  keycloak:
    build:
      context: .
      target: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__BOOTSTRAP_SERVERS: kafka:9092
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__TOPIC_OVERRIDES: "LOGOUT=keycloak.events.{realmName}.logout"
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__EXCLUDE_EVENT_TYPES: USER_INFO_REQUEST
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__EXCLUDE_ADMIN_RESOURCE_TYPES: REALM_ROLE
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # --- `secure` profile: `docker compose --profile secure up --build -d` -------------------------------
  # TLS + SASL/SCRAM transport, zstd compression (codec JAR added to providers/, as the README describes) and
  # the outbox delivery mode.

  secure-secrets:
    image: apache/kafka:4.3.1
    profiles: ["secure"]
    user: root
    entrypoint: ["/bin/sh", "/generate-secrets.sh"]
    volumes:
      - ./docker/secure/generate-secrets.sh:/generate-secrets.sh:ro
      - secure-secrets:/secrets

  kafka-secure:
    image: apache/kafka:4.3.1
    profiles: ["secure"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT stays inside the compose network for the broker's own tools (topic setup, e2e consumer);
      # Keycloak only uses SASL_SSL.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,SASL_SSL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-secure:9092,SASL_SSL://kafka-secure:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-secure:9093
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_SSL_KEYSTORE_FILENAME: broker.p12
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_CREDENTIALS: broker_keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: broker_key_creds
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/broker_jaas.conf
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - secure-secrets:/etc/kafka/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    depends_on:
      secure-secrets:
        condition: service_completed_successfully

  # Creates Keycloak's SCRAM user and the default topics.
  kafka-secure-init:
    image: apache/kafka:4.3.1
    profiles: ["secure"]
    command:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka-secure:9092 --alter \
          --add-config 'SCRAM-SHA-512=[password=keycloak-secret]' --entity-type users --entity-name keycloak || exit 1
        for topic in keycloak.events keycloak.admin-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-secure:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done
    depends_on:
      kafka-secure:
        condition: service_healthy

  postgres-secure:
    image: postgres:17.6
    profiles: ["secure"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Two Keycloak nodes, production-style: `start --optimized` on the keycloak-prod image (Postgres, health,
  # metrics built in), clustered through the shared database (Keycloak's default jdbc-ping cache stack).
  keycloak-secure:
    build:
      context: .
      target: keycloak-prod
    image: keycloak-kafka-events-keycloak-prod
    profiles: ["secure"]
    command: start --optimized --import-realm
    environment: &keycloak-secure-env
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB_URL: jdbc:postgresql://postgres-secure:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__BOOTSTRAP_SERVERS: kafka-secure:9095
      # SASL credentials and the truststore password live in the file, not in the environment.
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__PRODUCER_PROPERTIES_FILE: /opt/keycloak/conf/kafka/kafka-client.properties
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__PRODUCER_COMPRESSION_TYPE: zstd
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__DELIVERY_MODE: outbox
    volumes:
      - secure-secrets:/opt/keycloak/conf/kafka:ro
    ports:
      - "8082:8080"
      - "9002:9000"
    healthcheck: &keycloak-health
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
    depends_on:
      kafka-secure-init:
        condition: service_completed_successfully
      postgres-secure:
        condition: service_healthy

  # Second node; starts after the first has created the schema and imported the realm.
  keycloak-secure-2:
    image: keycloak-kafka-events-keycloak-prod
    profiles: ["secure"]
    command: start --optimized
    environment: *keycloak-secure-env
    volumes:
      - secure-secrets:/opt/keycloak/conf/kafka:ro
    ports:
      - "8083:8080"
      - "9003:9000"
    healthcheck: *keycloak-health
    depends_on:
      keycloak-secure:
        condition: service_healthy

  # Optional web UI for browsing topics: `docker compose --profile ui up -d`
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["ui"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  secure-secrets:
