# ============================================================================
# DEMO / DEVELOPMENT ONLY — DO NOT USE AS-IS IN PRODUCTION.
#
#   - `start-dev` runs Keycloak with the dev profile (HTTP, in-memory H2).
#   - Bootstrap admin credentials are `admin` / `admin`.
#   - The `kafka-demo` realm pre-creates `testuser` / `password`.
#   - Kafka is a single-node KRaft broker with PLAINTEXT listeners and
#     auto topic creation; no auth, no TLS, replication factor 1.
#
# Listeners:
#   kafka:9092      — in-network (Keycloak → Kafka)
#   localhost:9094  — from the host (debugging, ad-hoc consumers)
# ============================================================================

services:
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates the listener's default topics before Keycloak starts. Auto-creation would work too, but the
  # producer waits at most max.block.ms (1 s) for a new topic's metadata, so the very first event could
  # time out while the broker creates the topic. Topics from custom templates are still auto-created.
  kafka-init:
    image: apache/kafka:4.3.1
    command:
      - sh
      - -c
      - |
        for topic in keycloak.events keycloak.admin-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1 || exit 1
        done
    depends_on:
      kafka:
        condition: service_healthy

  keycloak:
    build: .
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_SPI_EVENTS_LISTENER__KAFKA_EVENTS__BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  # Optional web UI for browsing topics: `docker compose --profile ui up -d`
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: ["ui"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
